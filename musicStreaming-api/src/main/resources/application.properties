spring.application.name=musicStreaming

# Pasta com as músicas (montada pelo compose)
music.root=${MUSIC_ROOT:/app/streaming}
music.scan-on-startup=true
music.cors-origins=http://localhost:5173

# H2 em arquivo para persistir entre reinícios
spring.datasource.url=jdbc:h2:file:${MUSIC_DATA:/app/data}/musicdb;AUTO_SERVER=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=100

# Cache
spring.cache.type=caffeine
spring.cache.cache-names=libraryTree,search
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=10m,recordStats

# Actuator
management.endpoints.web.exposure.include=health,info
